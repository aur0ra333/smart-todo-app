<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务看板 - Task Board</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">T</span>
                <span class="logo-text">Task Board</span>
            </div>
        </div>
    </nav>

    <main class="app-shell">
        <section class="hero-panel">
            <div>
                <p class="eyebrow">Task Board</p>
                <h1>任务看板</h1>
                <p class="subtitle">用一个轻量页面完成任务录入、优先级判断、截止日期跟踪和状态复盘。</p>
            </div>
            <div class="hero-actions">
                <button id="seed-btn" class="ghost-btn" type="button">重置示例</button>
                <button id="export-btn" class="primary-btn" type="button">导出 CSV</button>
            </div>
        </section>

        <section class="metrics-grid" aria-label="任务统计">
            <article class="metric-card">
                <span>总任务</span>
                <strong id="total-tasks">0</strong>
            </article>
            <article class="metric-card">
                <span>进行中</span>
                <strong id="doing-tasks">0</strong>
            </article>
            <article class="metric-card">
                <span>今日到期</span>
                <strong id="today-tasks">0</strong>
            </article>
            <article class="metric-card">
                <span>完成率</span>
                <strong id="completion-rate">0%</strong>
            </article>
        </section>

        <section class="workspace-grid">
            <form id="task-form" class="panel task-form">
                <div class="panel-header">
                    <div>
                        <h2>新增任务</h2>
                        <p>记录清楚"做什么、什么时候交、优先级多高"。</p>
                    </div>
                </div>
                <label>
                    <span>任务内容</span>
                    <input id="task-title" type="text" maxlength="80" placeholder="例如：整理数据看板 README 和截图说明" required>
                    <span class="field-error" id="title-error"></span>
                </label>
                <div class="form-row">
                    <label>
                        <span>优先级</span>
                        <select id="task-priority">
                            <option value="high">高</option>
                            <option value="medium" selected>中</option>
                            <option value="low">低</option>
                        </select>
                    </label>
                    <label>
                        <span>状态</span>
                        <select id="task-status">
                            <option value="todo">待处理</option>
                            <option value="doing" selected>进行中</option>
                            <option value="done">已完成</option>
                        </select>
                    </label>
                </div>
                <div class="form-row">
                    <label>
                        <span>分类</span>
                        <input id="task-category" type="text" list="category-list" placeholder="项目 / 学习 / 简历">
                        <datalist id="category-list">
                            <option value="项目">
                            <option value="学习">
                            <option value="简历">
                            <option value="生活">
                        </datalist>
                    </label>
                    <label>
                        <span>截止日期</span>
                        <input id="task-due" type="date">
                        <span class="field-error" id="due-error"></span>
                    </label>
                </div>
                <label>
                    <span>备注</span>
                    <textarea id="task-note" rows="3" maxlength="180" placeholder="补充验收标准、链接或下一步"></textarea>
                </label>
                <button class="primary-btn" type="submit">添加到看板</button>
            </form>

            <aside class="panel insight-panel">
                <div class="panel-header">
                    <div>
                        <h2>本周概览</h2>
                        <p>根据当前任务自动汇总。</p>
                    </div>
                </div>
                <div class="progress-block">
                    <div class="progress-head">
                        <span>完成进度</span>
                        <strong id="progress-label">0%</strong>
                    </div>
                    <div class="progress-track">
                        <span id="progress-bar"></span>
                    </div>
                </div>
                <div id="category-summary" class="category-summary"></div>
                <div class="timeline">
                    <h3>近期截止</h3>
                    <div id="timeline-list"></div>
                </div>
            </aside>
        </section>

        <section class="panel board-panel">
            <div class="status-strip" aria-label="状态说明">
                <div>
                    <span class="status-dot todo-dot"></span>
                    <strong>待处理</strong>
                    <small>确认任务和截止时间</small>
                </div>
                <div>
                    <span class="status-dot doing-dot"></span>
                    <strong>进行中</strong>
                    <small>优先推进的任务</small>
                </div>
                <div>
                    <span class="status-dot done-dot"></span>
                    <strong>已完成</strong>
                    <small>可清理或导出复盘</small>
                </div>
            </div>
            <div class="toolbar">
                <div class="search-box">
                    <span>搜索</span>
                    <input id="task-search" type="search" placeholder="任务、分类或备注">
                </div>
                <select id="filter-select" aria-label="筛选任务">
                    <option value="all">全部任务</option>
                    <option value="todo">待处理</option>
                    <option value="doing">进行中</option>
                    <option value="done">已完成</option>
                    <option value="today">今日到期</option>
                    <option value="overdue">已逾期</option>
                    <option value="high">高优先级</option>
                </select>
                <select id="sort-select" aria-label="排序任务">
                    <option value="due">按截止日期</option>
                    <option value="priority">按优先级</option>
                    <option value="created">按创建时间</option>
                    <option value="category">按分类</option>
                </select>
                <div class="view-toggle">
                    <button id="list-view-btn" class="view-btn active" type="button">列表</button>
                    <button id="kanban-view-btn" class="view-btn" type="button">看板</button>
                </div>
                <button id="clear-done-btn" class="ghost-btn" type="button">清理已完成</button>
            </div>
            <div class="batch-bar" id="batch-bar" style="display:none;">
                <label class="select-all-label">
                    <input type="checkbox" id="select-all-checkbox"> <span>全选</span>
                </label>
                <span class="batch-count" id="batch-count">已选 0 项</span>
                <button id="batch-complete-btn" class="ghost-btn" type="button">标记已完成</button>
                <button id="batch-delete-btn" class="ghost-btn danger-btn" type="button">批量删除</button>
            </div>

            <div id="task-list" class="task-list"></div>

            <div id="kanban-view" class="kanban-grid" style="display:none;">
                <div class="kanban-column" data-status="todo">
                    <div class="kanban-col-header todo-header">
                        <span class="status-dot todo-dot"></span>
                        <strong>待处理</strong>
                        <span class="kanban-count" id="kanban-count-todo">0</span>
                    </div>
                    <div class="kanban-list" id="kanban-todo"></div>
                </div>
                <div class="kanban-column" data-status="doing">
                    <div class="kanban-col-header doing-header">
                        <span class="status-dot doing-dot"></span>
                        <strong>进行中</strong>
                        <span class="kanban-count" id="kanban-count-doing">0</span>
                    </div>
                    <div class="kanban-list" id="kanban-doing"></div>
                </div>
                <div class="kanban-column" data-status="done">
                    <div class="kanban-col-header done-header">
                        <span class="status-dot done-dot"></span>
                        <strong>已完成</strong>
                        <span class="kanban-count" id="kanban-count-done">0</span>
                    </div>
                    <div class="kanban-list" id="kanban-done"></div>
                </div>
            </div>

            <div id="empty-state" class="empty-state">
                <h3>没有匹配的任务</h3>
                <p>调整筛选条件，或者新增一个任务开始整理。</p>
            </div>
        </section>

        <section class="panel trend-panel">
            <div class="panel-header">
                <div>
                    <h2>任务完成趋势</h2>
                    <p>最近 7 天每天完成的任务数量。</p>
                </div>
            </div>
            <div id="trend-chart" class="trend-chart"></div>
        </section>
    </main>

    <template id="task-card-template">
        <article class="task-card">
            <div class="task-topline">
                <input type="checkbox" class="task-checkbox" title="选择此任务">
                <span class="priority-pill"></span>
                <span class="due-pill"></span>
                <span class="countdown-pill"></span>
            </div>
            <h3></h3>
            <p class="task-note"></p>
            <div class="task-meta">
                <span class="category"></span>
                <span class="created"></span>
            </div>
            <div class="task-actions">
                <button class="edit-btn" type="button">编辑</button>
                <button class="status-btn" type="button"></button>
                <button class="delete-btn" type="button">删除</button>
            </div>
        </article>
    </template>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>编辑任务</h2>
                <button class="modal-close" type="button" id="edit-modal-close">&times;</button>
            </div>
            <form id="edit-form" class="task-form">
                <label>
                    <span>任务内容</span>
                    <input id="edit-title" type="text" maxlength="80" required>
                    <span class="field-error" id="edit-title-error"></span>
                </label>
                <div class="form-row">
                    <label>
                        <span>优先级</span>
                        <select id="edit-priority">
                            <option value="high">高</option>
                            <option value="medium">中</option>
                            <option value="low">低</option>
                        </select>
                    </label>
                    <label>
                        <span>状态</span>
                        <select id="edit-status">
                            <option value="todo">待处理</option>
                            <option value="doing">进行中</option>
                            <option value="done">已完成</option>
                        </select>
                    </label>
                </div>
                <div class="form-row">
                    <label>
                        <span>分类</span>
                        <input id="edit-category" type="text" list="category-list" placeholder="项目 / 学习 / 简历">
                    </label>
                    <label>
                        <span>截止日期</span>
                        <input id="edit-due" type="date">
                    </label>
                </div>
                <label>
                    <span>备注</span>
                    <textarea id="edit-note" rows="3" maxlength="180" placeholder="补充验收标准、链接或下一步"></textarea>
                </label>
                <div class="modal-actions">
                    <button class="ghost-btn" type="button" id="edit-cancel-btn">取消</button>
                    <button class="primary-btn" type="submit">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card modal-sm">
            <p id="confirm-message" class="confirm-message"></p>
            <div class="modal-actions">
                <button class="ghost-btn" type="button" id="confirm-cancel">取消</button>
                <button class="primary-btn danger-btn" type="button" id="confirm-ok">确定</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
