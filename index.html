<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能待办事项 - Smart Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 动态背景 -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <div class="container glass">
        <header>
            <div class="header-top">
                <h1><span class="header-icon">📝</span> 智能待办事项</h1>
                <button class="theme-toggle" id="theme-toggle" title="切换主题">
                    <span class="icon">🌙</span>
                </button>
            </div>
            <p class="subtitle">高效管理你的每一天 ✨</p>
        </header>

        <div class="stats-container">
            <div class="stat-card glass">
                <div class="stat-icon">📊</div>
                <div class="stat-number" id="total-tasks">0</div>
                <div class="stat-label">总任务</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon">✅</div>
                <div class="stat-number" id="completed-tasks">0</div>
                <div class="stat-label">已完成</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon">⏳</div>
                <div class="stat-number" id="pending-tasks">0</div>
                <div class="stat-label">待完成</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon">📈</div>
                <div class="stat-number" id="completion-rate">0%</div>
                <div class="stat-label">完成率</div>
            </div>
        </div>

        <div class="add-task-form">
            <input type="text" id="task-input" placeholder="输入任务内容..." />
            <div class="form-controls">
                <select id="priority-select">
                    <option value="low">🟢 低优先级</option>
                    <option value="medium" selected>🟡 中优先级</option>
                    <option value="high">🔴 高优先级</option>
                </select>
                <input type="text" id="category-input" placeholder="分类 (如：工作、学习)" list="category-list" />
                <datalist id="category-list">
                    <option value="工作">
                    <option value="学习">
                    <option value="生活">
                    <option value="健康">
                    <option value="其他">
                </datalist>
                <button id="add-btn" class="btn-primary">
                    <span>添加</span>
                    <span class="btn-icon">+</span>
                </button>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="pending">待完成</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
            <button class="filter-btn" data-filter="high">🔴 高优先级</button>
            <button class="filter-btn" data-filter="today">📅 今天</button>
        </div>

        <div class="sort-options">
            <span>排序：</span>
            <select id="sort-select">
                <option value="default">默认排序</option>
                <option value="priority">按优先级</option>
                <option value="date">按日期</option>
                <option value="category">按分类</option>
            </select>
        </div>

        <div class="task-list" id="task-list">
            <!-- 任务列表将通过 JavaScript 动态加载 -->
        </div>

        <div class="empty-state" id="empty-state">
            <div class="empty-icon">🎉</div>
            <h3>太棒了！</h3>
            <p>所有任务都已完成，或者还没有添加任务</p>
            <button class="btn-primary" onclick="document.getElementById('task-input').focus()">
                添加第一个任务
            </button>
        </div>

        <div class="quick-actions">
            <button class="btn-action" onclick="clearCompleted()">
                <span>🗑️</span>
                <span>清除已完成</span>
            </button>
            <button class="btn-action" onclick="exportTasks()">
                <span>📤</span>
                <span>导出任务</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
